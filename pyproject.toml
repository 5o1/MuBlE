[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muble-modern"
version = "2.0.0a0"
description = "MuBlE runtime migrated to Python 3.12, MuJoCo 3.15, robosuite 1.5 and Blender 4.5"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "mujoco>=3.15,<3.16",
  "numpy==1.26.4",
  "robosuite==1.5.2",
  "scipy==1.17.1",
  "numba==0.68.0",
  "mink==0.0.5",
  "qpsolvers[quadprog]==4.13.0",
  "opencv-python==4.10.0.84",
  "Pillow>=12,<13",
  "pynput>=1.8,<2",
  "termcolor>=3,<4",
  "tqdm>=4.70,<5",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
segmentation = ["pycocotools>=2.0.7"]

[tool.setuptools.packages.find]
include = ["muble*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
